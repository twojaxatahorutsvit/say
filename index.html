<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020403" />
    <meta
      name="description"
      content="Імерсивний hero-екран із керованим скролом опусканням приладу нічного бачення."
    />
    <title>КСБУ — Night Vision Interface</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" id="hero" aria-label="Активація нічного бачення">
        <div class="hero__sticky">
          <video
            class="hero__video"
            id="nvg-video"
            src="./assets/nvg-lowering.mp4"
            preload="auto"
            muted
            playsinline
            disablepictureinpicture
            aria-label="Прилад нічного бачення опускається на очі"
          ></video>

          <img
            class="hero__scene"
            src="./assets/nvg-forest-scene.png"
            alt=""
            fetchpriority="high"
            aria-hidden="true"
          />

          <div class="hero__exposure" aria-hidden="true"></div>
          <div class="hero__strap-mask" aria-hidden="true"></div>
          <div class="hero__vignette" aria-hidden="true"></div>
          <div class="hero__phosphor" aria-hidden="true"></div>
          <div class="hero__signal-flash" aria-hidden="true"></div>
          <div class="hero__noise" aria-hidden="true"></div>
          <div class="hero__scanlines" aria-hidden="true"></div>

          <header class="hud" aria-label="Системний інтерфейс">
            <div class="hud__item hud__item--brand">
              <span class="hud__dot" aria-hidden="true"></span>
              <span>КСБУ</span>
              <span class="hud__muted">FIELD SYSTEM</span>
            </div>
            <div class="hud__item hud__item--state" id="system-state">
              OPTICS // STANDBY
            </div>
          </header>

          <div class="scroll-cue" id="scroll-cue" aria-hidden="true">
            <span class="scroll-cue__label">SCROLL TO ENGAGE</span>
            <span class="scroll-cue__line"><i></i></span>
          </div>

          <div class="progress" aria-hidden="true">
            <span class="progress__index">00</span>
            <span class="progress__track"><i></i></span>
            <span class="progress__index">01</span>
          </div>

          <div class="loader" id="loader" role="status" aria-live="polite">
            <span class="loader__pulse"></span>
            <span>LOADING OPTICS</span>
          </div>
        </div>
      </section>

      <section class="zero" id="zero" aria-labelledby="zero-title">
        <div class="zero__shell section-shell">
          <header class="zero__header">
            <div>
              <p class="eyebrow">04 / Zero</p>
              <h1 id="zero-title">Калібрування<br />сигналу.</h1>
            </div>
            <p class="zero__status" id="zero-status" aria-live="polite">
              OPTICS // SCAN
            </p>
          </header>

          <div
            class="zero__stage"
            id="zero-stage"
            tabindex="0"
            aria-label="Поле калібрування. Наведіть приціл на світлу мішень і натисніть."
          >
            <div class="zero__grid" aria-hidden="true"></div>
            <div class="zero__haze" aria-hidden="true"></div>
            <div class="zero__noise" aria-hidden="true"></div>
            <div class="zero__flash" id="zero-flash" aria-hidden="true"></div>

            <button class="zero__target" type="button" data-target style="--target-x: 21%; --target-y: 27%;" aria-label="Мішень один">
              <span></span><i></i>
            </button>
            <button class="zero__target" type="button" data-target style="--target-x: 72%; --target-y: 39%;" aria-label="Мішень два">
              <span></span><i></i>
            </button>
            <button class="zero__target" type="button" data-target style="--target-x: 43%; --target-y: 73%;" aria-label="Мішень три">
              <span></span><i></i>
            </button>

            <div class="zero__reticle" id="zero-reticle" aria-hidden="true">
              <span></span><i></i>
            </div>
            <div class="zero__readout zero__readout--left" aria-hidden="true">
              <span>RANGE</span><b id="zero-range">087</b>
            </div>
            <div class="zero__readout zero__readout--right" aria-hidden="true">
              <span>LOCK</span><b id="zero-lock">0 / 3</b>
            </div>
            <p class="zero__hint" id="zero-hint">MOVE / AIM / SIGNAL</p>
          </div>

          <footer class="zero__footer">
            <p>Переміщай курсор або торкнись поля. Влуч у три мішені.</p>
            <p>FIELD SYSTEM // CALIBRATION MODULE</p>
          </footer>
        </div>
      </section>
    </main>

    <noscript>
      <p class="noscript">Для керування відео прокруткою потрібен JavaScript.</p>
    </noscript>
    <script src="./script.js"></script>
  </body>
</html>
